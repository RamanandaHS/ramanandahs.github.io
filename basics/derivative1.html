<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derivative Quest — Level 1 | Power Rule</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js" defer></script>

<style>
  :root{
    --navy-950:#0B1220;
    --navy-800:#16213A;
    --navy-700:#202D4A;
    --paper:#F1F4F8;
    --card:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --amber:#E8A33D;
    --amber-dark:#C97F1E;
    --teal:#2A9D8F;
    --teal-dark:#20776C;
    --coral:#E4572E;
    --border:#DCE3EC;
    --radius:14px;
    --shadow:0 6px 20px rgba(16,25,48,0.08);
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  .app{ max-width:1100px; margin:0 auto; padding:0 0 60px; }

  /* ---------- HERO / HEADER ---------- */
  .hero{
    background:radial-gradient(1200px 320px at 15% -20%, #1C2A4A 0%, var(--navy-950) 55%);
    color:#fff;
    padding:28px 24px 22px;
    border-radius:0 0 24px 24px;
    position:relative;
    overflow:hidden;
  }
  .hero-top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .hero h1{
    font-family:var(--font-display);
    font-size:clamp(1.5rem, 4vw, 2.1rem);
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .hero .level-tag{
    font-family:var(--font-display);
    font-weight:600;
    font-size:0.95rem;
    color:var(--amber);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin:0 0 6px;
  }
  .hero .subtitle{
    margin:10px 0 0;
    font-size:0.95rem;
    color:#B9C4DA;
    max-width:520px;
  }

  /* staircase level rail — signature element */
  .staircase-rail{ display:flex; align-items:flex-end; gap:0; margin-top:22px; }
  .stair-step{ display:flex; flex-direction:column; align-items:center; width:64px; position:relative; }
  .stair-step .platform{
    width:100%; height:6px; background:var(--navy-700); border-radius:3px 3px 0 0;
  }
  .stair-step.active .platform{ background:linear-gradient(90deg, var(--amber-dark), var(--amber)); box-shadow:0 0 14px rgba(232,163,61,0.55); }
  .stair-step .dot{
    width:30px; height:30px; border-radius:50%;
    background:var(--navy-700); border:2px solid #2B3B60;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:0.75rem; font-weight:700; color:#7C8AA8;
    margin-bottom:8px;
  }
  .stair-step.active .dot{
    background:var(--amber); border-color:var(--amber); color:var(--navy-950);
    box-shadow:0 0 0 5px rgba(232,163,61,0.18);
  }
  .stair-step .lvl-label{ font-size:0.65rem; color:#7C8AA8; margin-top:6px; letter-spacing:0.04em; }
  .stair-step.active .lvl-label{ color:var(--amber); font-weight:600; }
  /* stagger heights to read as a descending staircase, left (level1) high -> right (level5) low */
  .stair-step:nth-child(1){ margin-bottom:26px; }
  .stair-step:nth-child(2){ margin-bottom:19px; }
  .stair-step:nth-child(3){ margin-bottom:12px; }
  .stair-step:nth-child(4){ margin-bottom:6px; }
  .stair-step:nth-child(5){ margin-bottom:0px; }

  /* ---------- DASHBOARD LAYOUT ---------- */
  .dashboard{
    display:grid; grid-template-columns: 250px 1fr; gap:18px;
    padding:20px 20px 0;
  }
  @media(max-width:820px){
    .dashboard{ grid-template-columns: 1fr; }
    .rail-order{ order:-1; }
  }

  .rail{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px; align-self:start; position:sticky; top:16px;
  }
  @media(max-width:820px){ .rail{ position:static; } }

  .rail h3{
    font-family:var(--font-display); font-size:0.78rem; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--ink-soft); margin:0 0 12px;
  }

  .checklist{ list-style:none; margin:0 0 18px; padding:0; display:flex; flex-direction:column; gap:10px; }
  .checklist li{ display:flex; align-items:center; gap:10px; font-size:0.88rem; color:var(--ink-soft); }
  .checklist li .mark{
    width:22px; height:22px; border-radius:50%; flex:0 0 22px;
    border:2px solid var(--border); display:flex; align-items:center; justify-content:center;
    font-size:0.7rem; font-weight:700; color:transparent;
  }
  .checklist li.done{ color:var(--ink); font-weight:500; }
  .checklist li.done .mark{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .checklist li.current .mark{ border-color:var(--amber); background:var(--amber); color:#fff; }
  .checklist li.current{ color:var(--ink); font-weight:600; }

  .timer-box{
    background:var(--navy-950); color:#fff; border-radius:12px; padding:14px; text-align:center; margin-bottom:14px;
  }
  .timer-box .lbl{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:#8EA0C4; margin-bottom:4px; }
  .timer-box .clock{ font-family:var(--font-mono); font-size:1.9rem; font-weight:600; letter-spacing:0.02em; }
  .timer-box.warning .clock{ color:var(--amber); }
  .timer-box.urgent .clock{ color:var(--coral); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.45;} }

  .score-box{
    display:flex; align-items:center; justify-content:space-between;
    background:#FBF3E4; border:1px solid #F0DEB4; border-radius:12px; padding:10px 14px;
  }
  .score-box .stair-mini{ display:flex; gap:2px; align-items:flex-end; }
  .score-box .stair-mini span{ width:5px; background:var(--amber); border-radius:1px; }
  .score-box .stair-mini span:nth-child(1){ height:6px; }
  .score-box .stair-mini span:nth-child(2){ height:10px; }
  .score-box .stair-mini span:nth-child(3){ height:14px; }
  .score-box .label{ font-size:0.72rem; color:var(--amber-dark); text-transform:uppercase; letter-spacing:0.05em; font-weight:600; }
  .score-box .value{ font-family:var(--font-display); font-size:1.3rem; font-weight:700; color:var(--ink); }

  .restart-link{
    display:block; text-align:center; margin-top:14px; font-size:0.78rem; color:var(--ink-soft);
    text-decoration:underline; cursor:pointer; background:none; border:none; width:100%; font-family:var(--font-body);
  }
  .restart-link:hover{ color:var(--coral); }

  /* ---------- STAGE PANEL ---------- */
  .stage-panel{ min-height:420px; }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:26px 26px 24px; margin-bottom:16px;
  }
  .card h2{ font-family:var(--font-display); font-size:1.35rem; margin:0 0 4px; }
  .card .eyebrow{ font-size:0.75rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--amber-dark); font-weight:700; margin-bottom:6px; }
  .card p{ margin:10px 0; color:var(--ink); }
  .muted{ color:var(--ink-soft); }

  .rule-box{
    background:var(--navy-950); color:#fff; border-radius:12px; padding:20px; text-align:center; margin:16px 0;
    font-size:1.15rem;
  }
  .rule-box.small{ font-size:1rem; padding:14px; }

  .transform-flow{
    display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin:18px 0; padding:16px;
    background:var(--paper); border-radius:12px;
  }
  .transform-flow .step{ font-size:1.2rem; opacity:0; transform:translateY(8px); animation:fadeUp 0.5s ease forwards; }
  .transform-flow .arrow{ color:var(--amber-dark); font-size:1.3rem; opacity:0; animation:fadeUp 0.5s ease forwards; }
  .transform-flow .caption{ font-size:0.78rem; color:var(--ink-soft); flex-basis:100%; text-align:center; opacity:0; animation:fadeUp 0.5s ease forwards; }
  @keyframes fadeUp{ to{ opacity:1; transform:translateY(0);} }

  .callout{ background:#EAF6F4; border-left:4px solid var(--teal); border-radius:8px; padding:12px 16px; margin:14px 0; font-size:0.92rem; }
  .callout.amber{ background:#FDF3E2; border-left-color:var(--amber); }

  .btn{
    font-family:var(--font-display); font-weight:600; font-size:0.95rem;
    border:none; border-radius:10px; padding:13px 22px; cursor:pointer;
    background:var(--navy-950); color:#fff; transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover{ transform:translateY(-1px); box-shadow:0 6px 16px rgba(16,25,48,0.22); }
  .btn:active{ transform:translateY(0); }
  .btn.amber{ background:linear-gradient(135deg, var(--amber-dark), var(--amber)); color:var(--navy-950); }
  .btn.teal{ background:linear-gradient(135deg, var(--teal-dark), var(--teal)); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-row{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; flex-wrap:wrap; }

  .step-reveal{ display:none; margin:14px 0; padding-left:14px; border-left:3px solid var(--border); opacity:0; animation:fadeUp 0.4s ease forwards; }
  .step-reveal.shown{ display:block; }
  .step-reveal .step-num{ font-family:var(--font-display); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--amber-dark); font-weight:700; }

  .challenge-head{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .challenge-badge{
    font-family:var(--font-display); background:var(--navy-950); color:var(--amber); font-weight:700;
    border-radius:8px; padding:4px 10px; font-size:0.78rem; letter-spacing:0.04em;
  }

  .answer-row{ display:flex; gap:10px; margin:18px 0 6px; flex-wrap:wrap; }
  .answer-row input[type="text"]{
    flex:1; min-width:220px; font-family:var(--font-mono); font-size:1.05rem;
    padding:13px 14px; border:2px solid var(--border); border-radius:10px; outline:none; color:var(--ink);
  }
  .answer-row input[type="text"]:focus{ border-color:var(--amber); }
  label.visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;
  }

  .feedback{ border-radius:10px; padding:14px 16px; margin:14px 0; font-weight:500; opacity:0; animation:fadeUp 0.35s ease forwards; }
  .feedback.correct{ background:#E6F6EE; color:var(--teal-dark); border:1px solid #BFE7D4; }
  .feedback.wrong{ background:#FDECE7; color:#A83A1E; border:1px solid #F5C5B4; }
  .feedback .pts{ display:inline-block; margin-top:6px; font-family:var(--font-display); font-weight:700; color:var(--amber-dark); }

  .hint-box{ background:#FFF8EA; border:1px dashed var(--amber); border-radius:10px; padding:12px 16px; margin:12px 0; font-size:0.92rem; opacity:0; animation:fadeUp 0.35s ease forwards;}
  .hint-box strong{ color:var(--amber-dark); }

  .solution-box{ background:var(--navy-950); color:#fff; border-radius:10px; padding:16px; margin:14px 0; }

  .practice-block{ margin-top:18px; padding-top:16px; border-top:1px dashed var(--border); }

  /* ---------- COMPLETE SCREEN ---------- */
  .complete-hero{ text-align:center; padding:36px 20px; }
  .complete-hero .trophy{ font-size:3rem; }
  .complete-hero h2{ font-family:var(--font-display); font-size:1.9rem; margin:10px 0 2px; }
  .stats-table{ width:100%; max-width:420px; margin:22px auto; border-collapse:collapse; text-align:left; }
  .stats-table td{ padding:9px 6px; border-bottom:1px solid var(--border); font-size:0.95rem; }
  .stats-table td:last-child{ text-align:right; font-family:var(--font-mono); font-weight:600; }
  .stats-table td.check{ color:var(--teal); font-weight:700; text-align:right; font-family:var(--font-body); }

  .unlock-card{
    background:linear-gradient(135deg, var(--navy-800), var(--navy-950)); color:#fff;
    border-radius:14px; padding:20px; max-width:420px; margin:0 auto 10px; text-align:center;
  }
  .unlock-card .lock-title{ font-family:var(--font-display); color:var(--amber); font-weight:700; margin-bottom:4px; }

  .confetti{ position:fixed; top:-10px; width:8px; height:14px; z-index:999; border-radius:2px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(100vh) rotate(400deg); opacity:0.3; } }

  .timeup-overlay{
    background:#FDECE7; border:1px solid #F5C5B4; border-radius:14px; padding:26px; text-align:center;
  }
  .timeup-overlay h2{ color:#A83A1E; font-family:var(--font-display); }

  .locked-note{ text-align:center; font-size:0.75rem; color:var(--ink-soft); margin-top:6px; }

  @media(max-width:520px){
    .card{ padding:20px 16px; }
    .stair-step{ width:52px; }
    .btn{ width:100%; }
    .btn-row{ flex-direction:column; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="hero">
    <div class="hero-top">
      <div>
        <p class="level-tag">🎯 Derivative Quest</p>
        <h1>Level 1 — Power Rule &amp; Polynomial Derivatives</h1>
        <p class="subtitle">Learn the rule → Practice → Pass the challenge → Unlock the next level</p>
      </div>
    </div>
    <div class="staircase-rail" role="img" aria-label="Level 1 of 5, only Level 1 is unlocked">
      <div class="stair-step active">
        <div class="dot">1</div>
        <div class="platform"></div>
        <div class="lvl-label">LEVEL 1</div>
      </div>
      <div class="stair-step"><div class="dot">2</div><div class="platform"></div><div class="lvl-label">LEVEL 2</div></div>
      <div class="stair-step"><div class="dot">3</div><div class="platform"></div><div class="lvl-label">LEVEL 3</div></div>
      <div class="stair-step"><div class="dot">4</div><div class="platform"></div><div class="lvl-label">LEVEL 4</div></div>
      <div class="stair-step"><div class="dot">5</div><div class="platform"></div><div class="lvl-label">LEVEL 5</div></div>
    </div>
  </header>

  <div class="dashboard">
    <aside class="rail rail-order">
      <h3>Level 1 Progress</h3>
      <ul class="checklist" id="checklist"></ul>

      <div class="timer-box" id="timerBox">
        <div class="lbl">Time Remaining</div>
        <div class="clock" id="clockDisplay">08:00</div>
      </div>

      <div class="score-box">
        <div>
          <div class="label">Score</div>
          <div class="value" id="scoreValue">0</div>
        </div>
        <div class="stair-mini" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>

      <button class="restart-link" id="restartBtn" type="button">Restart Level 1</button>
    </aside>

    <main class="stage-panel" id="stagePanel">
      <!-- dynamic stage content injected here -->
    </main>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     0. CONFIG & ANALYTICS
  ========================================================= */
  const STORAGE_KEY = "derivativeQuest_level1_progress";
  const LEVEL_SECONDS = 8 * 60;
  const STAGES = ["learn","example1","example2","challenge1","challenge2","complete"];
  const STAGE_LABELS = ["Learn","Example 1","Example 2","Challenge 1","Challenge 2","Mastery"];

  // ---- GA4 hook — do NOT hardcode a real Measurement ID here. ----
  // To wire up real GA4 later:
  //   1. Add the gtag.js snippet to <head> with your Measurement ID.
  //   2. That's it — trackEvent() below already calls gtag() if it exists.
  function trackEvent(eventName, eventParams = {}) {
    if (typeof gtag === "function") {
      gtag("event", eventName, eventParams);
    }
    // Uncomment for local debugging:
    // console.log("[analytics]", eventName, eventParams);
  }

  /* =========================================================
     1. STATE
  ========================================================= */
  const defaultState = () => ({
    stage: "learn",
    startTime: null,
    completionTime: null,
    startedEventFired: false,
    score: 0,
    totalAttempts: 0,
    hintsUsed: 0,
    correctFirstTry: 0,
    timeUp: false,
    challenges: {
      1: null, // built lazily
      2: null
    }
  });

  let state = loadState();

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      const parsed = JSON.parse(raw);
      return Object.assign(defaultState(), parsed);
    }catch(e){
      return defaultState();
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ /* storage unavailable — game still works, just won't persist */ }
  }

  /* =========================================================
     2. MATH ENGINE — parsing, derivatives, question generation
     (no eval() is used anywhere on student input)
  ========================================================= */

  // Turn "20x^4 - 6x + 0" / "20*x^4-6*x" into { 4: 20, 1: -6 }
  function parsePolynomial(raw){
    if(typeof raw !== "string") return null;
    let expr = raw.trim().toLowerCase();
    if(expr === "") return null;
    expr = expr.replace(/\s+/g, "").replace(/\*\*/g, "^").replace(/\*/g, "");
    if(expr[0] !== "+" && expr[0] !== "-") expr = "+" + expr;

    const termPattern = /[+-][^+-]+/g;
    const rawTerms = expr.match(termPattern);
    if(!rawTerms) return null;

    const map = {};
    for(const t of rawTerms){
      const sign = t[0] === "-" ? -1 : 1;
      const body = t.slice(1);
      if(body === "") return null;

      let coeff, power;
      if(body.indexOf("x") !== -1){
        const parts = body.split("x");
        if(parts.length !== 2) return null;
        const coeffPart = parts[0];
        const powerPart = parts[1];
        coeff = coeffPart === "" ? 1 : parseFloat(coeffPart);
        if(powerPart === ""){
          power = 1;
        } else if(powerPart[0] === "^"){
          power = parseInt(powerPart.slice(1), 10);
        } else {
          return null;
        }
      } else {
        coeff = parseFloat(body);
        power = 0;
      }
      if(isNaN(coeff) || isNaN(power)) return null;
      coeff = sign * coeff;
      map[power] = (map[power] || 0) + coeff;
    }
    Object.keys(map).forEach(k => { if(Math.abs(map[k]) < 1e-9) delete map[k]; });
    return map;
  }

  function mapsEqual(a, b){
    const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
    for(const k of keys){
      const av = (a && a[k]) || 0;
      const bv = (b && b[k]) || 0;
      if(Math.abs(av - bv) > 1e-9) return false;
    }
    return true;
  }

  function differentiate(polyMap){
    const result = {};
    Object.keys(polyMap).forEach(pStr => {
      const p = parseInt(pStr, 10);
      const c = polyMap[pStr];
      if(p === 0) return; // constant vanishes
      const newPower = p - 1;
      const newCoeff = c * p;
      if(Math.abs(newCoeff) > 1e-9){
        result[newPower] = (result[newPower] || 0) + newCoeff;
      }
    });
    return result;
  }

  function checkDerivativeAnswer(studentInput, correctMap){
    const parsed = parsePolynomial(studentInput);
    if(parsed === null) return { valid: false, correct: false };
    return { valid: true, correct: mapsEqual(parsed, correctMap) };
  }

  function termLatex(power, coeff, isFirst){
    const sign = coeff < 0 ? "-" : (isFirst ? "" : "+");
    const abs = Math.abs(coeff);
    let core;
    if(power === 0) core = `${abs}`;
    else if(power === 1) core = `${abs}x`;
    else core = `${abs}x^{${power}}`;
    return `${sign}${core}`;
  }

  function polyMapToLatex(map){
    const powers = Object.keys(map).map(Number).sort((a,b) => b - a);
    if(powers.length === 0) return "0";
    return powers.map((p, i) => termLatex(p, map[p], i === 0)).join("");
  }

  function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr){ return arr[randInt(0, arr.length - 1)]; }

  function generatePowerQuestion(excludeN){
    let n;
    do { n = randInt(2, 9); } while(n === excludeN);
    const polyMap = { [n]: 1 };
    return {
      polyMap,
      questionLatex: `f(x)=x^{${n}}`,
      correctMap: differentiate(polyMap)
    };
  }

  function generatePolynomialQuestion(){
    const numTerms = pick([2, 3]);
    const includeConstant = Math.random() < 0.4;
    const powerSlots = numTerms - (includeConstant ? 1 : 0);
    const availablePowers = [2,3,4,5,6,7];
    // shuffle & take distinct powers
    for(let i = availablePowers.length - 1; i > 0; i--){
      const j = randInt(0, i);
      [availablePowers[i], availablePowers[j]] = [availablePowers[j], availablePowers[i]];
    }
    const chosenPowers = availablePowers.slice(0, Math.max(powerSlots, 1)).sort((a,b) => b - a);

    const polyMap = {};
    chosenPowers.forEach((p, idx) => {
      let coeff = randInt(2, 9);
      // keep the leading term positive for a cleaner-looking question; others can be either sign
      const negative = idx > 0 && Math.random() < 0.55;
      if(negative) coeff = -coeff;
      polyMap[p] = coeff;
    });
    if(includeConstant){
      polyMap[0] = randInt(2, 9) * (Math.random() < 0.5 ? -1 : 1);
    }

    return {
      polyMap,
      questionLatex: `f(x)=${polyMapToLatex(polyMap)}`,
      correctMap: differentiate(polyMap)
    };
  }

  /* =========================================================
     3. TIMER
  ========================================================= */
  let timerInterval = null;

  function elapsedSeconds(){
    if(!state.startTime) return 0;
    return Math.floor((Date.now() - state.startTime) / 1000);
  }

  function startTimer(){
    stopTimer();
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      updateTimerDisplay();
    }, 1000);
  }

  function stopTimer(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  }

  function updateTimerDisplay(){
    const clock = document.getElementById("clockDisplay");
    const box = document.getElementById("timerBox");
    if(!clock || !box) return;

    if(state.stage === "complete"){
      clock.textContent = "DONE";
      box.classList.remove("warning","urgent");
      stopTimer();
      return;
    }

    const remaining = Math.max(LEVEL_SECONDS - elapsedSeconds(), 0);
    const mm = String(Math.floor(remaining / 60)).padStart(2, "0");
    const ss = String(remaining % 60).padStart(2, "0");
    clock.textContent = `${mm}:${ss}`;

    box.classList.remove("warning","urgent");
    if(remaining <= 60) box.classList.add("urgent");
    else if(remaining <= 180) box.classList.add("warning");

    if(remaining <= 0 && !state.timeUp && state.stage !== "complete"){
      state.timeUp = true;
      trackEvent("derivative_level1_timeout", { stage: state.stage, score: state.score });
      saveState();
      stopTimer();
      render();
    }
  }

  function formatDuration(totalSeconds){
    const s = Math.max(totalSeconds, 0);
    const mm = String(Math.floor(s / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    return `${mm}:${ss}`;
  }

  /* =========================================================
     4. RENDER — SIDE RAIL
  ========================================================= */
  function renderRail(){
    const list = document.getElementById("checklist");
    const currentIndex = STAGES.indexOf(state.stage);
    list.innerHTML = STAGE_LABELS.map((label, i) => {
      const done = i < currentIndex || (state.stage === "complete");
      const current = i === currentIndex && state.stage !== "complete";
      const cls = done ? "done" : (current ? "current" : "");
      const mark = done ? "✓" : (current ? "●" : "");
      return `<li class="${cls}"><span class="mark">${mark}</span>${label}</li>`;
    }).join("");

    document.getElementById("scoreValue").textContent = state.score;
  }

  /* =========================================================
     5. TYPESET HELPER
  ========================================================= */
  function typeset(){
    if(window.MathJax && window.MathJax.typesetPromise){
      const panel = document.getElementById("stagePanel");
      window.MathJax.typesetPromise([panel]).catch(() => {});
    }
  }

  /* =========================================================
     6. STAGE: LEARN
  ========================================================= */
  function renderLearn(){
    const panel = document.getElementById("stagePanel");
    panel.innerHTML = `
      <div class="card">
        <p class="eyebrow">🎓 Mission</p>
        <h2>Learn the Power Rule</h2>
        <p>By the end of this level, you should be able to differentiate \\(x^n\\), \\(ax^n\\), polynomials, constants, and sums or differences of polynomial terms.</p>

        <div class="rule-box">\\[ \\boxed{\\dfrac{d}{dx}(x^n)=nx^{n-1}} \\]</div>
        <p class="muted" style="text-align:center;">Bring the power down as a multiplier and reduce the power by 1.</p>

        <div class="transform-flow">
          <span class="step" style="animation-delay:0.1s">\\(x^6\\)</span>
          <span class="arrow" style="animation-delay:0.4s">→</span>
          <span class="caption" style="animation-delay:0.6s">Power 6 comes down</span>
          <span class="arrow" style="animation-delay:0.9s">→</span>
          <span class="step" style="animation-delay:1.1s">\\(6x^5\\)</span>
        </div>
        <p>The exponent becomes the coefficient, and the exponent decreases by 1.</p>

        <h2 style="margin-top:26px;">Constant Rule</h2>
        <div class="rule-box small">\\[ \\dfrac{d}{dx}(c)=0 \\]</div>
        <p class="callout">Example: \\( \\dfrac{d}{dx}(7)=0 \\)</p>

        <h2 style="margin-top:26px;">Sum / Difference Rule</h2>
        <p>Differentiate each term separately.</p>
        <div class="callout amber">\\[ \\dfrac{d}{dx}\\left(3x^4-2x^2+5\\right)=12x^3-4x \\]</div>

        <div class="btn-row">
          <button class="btn amber" id="continueLearnBtn">CONTINUE →</button>
        </div>
      </div>
    `;
    typeset();
    document.getElementById("continueLearnBtn").addEventListener("click", () => {
      trackEvent("derivative_learning_completed", {});
      goToStage("example1");
    });
  }

  /* =========================================================
     7. STAGE: EXAMPLE 1
  ========================================================= */
  function renderExample1(){
    trackEvent("derivative_example_viewed", { example_number: 1 });
    const panel = document.getElementById("stagePanel");
    panel.innerHTML = `
      <div class="card">
        <p class="eyebrow">Worked Example 1</p>
        <h2>\\( f(x)=x^4 \\)</h2>

        <div class="step-reveal shown" id="ex1step1">
          <div class="step-num">Step 1</div>
          <p>Identify the power.</p>
          <p>\\( n=4 \\)</p>
        </div>
        <div class="step-reveal" id="ex1step2">
          <div class="step-num">Step 2</div>
          <p>Bring the power down.</p>
          <p>\\( 4x^3 \\)</p>
        </div>
        <div class="step-reveal" id="ex1step3">
          <div class="step-num">Step 3</div>
          <p>Final answer:</p>
          <div class="rule-box small">\\[ \\boxed{f'(x)=4x^3} \\]</div>
        </div>

        <div class="btn-row">
          <button class="btn" id="ex1NextStepBtn">SHOW NEXT STEP →</button>
          <button class="btn amber" id="ex1ContinueBtn" style="display:none;">NEXT EXAMPLE →</button>
        </div>
      </div>
    `;
    typeset();

    let step = 1;
    const nextBtn = document.getElementById("ex1NextStepBtn");
    const contBtn = document.getElementById("ex1ContinueBtn");

    nextBtn.addEventListener("click", () => {
      step++;
      if(step === 2){ document.getElementById("ex1step2").classList.add("shown"); typeset(); }
      if(step === 3){
        document.getElementById("ex1step3").classList.add("shown");
        typeset();
        nextBtn.style.display = "none";
        contBtn.style.display = "inline-block";
      }
    });

    contBtn.addEventListener("click", () => goToStage("example2"));
  }

  /* =========================================================
     8. STAGE: EXAMPLE 2
  ========================================================= */
  function renderExample2(){
    trackEvent("derivative_example_viewed", { example_number: 2 });
    const panel = document.getElementById("stagePanel");
    panel.innerHTML = `
      <div class="card">
        <p class="eyebrow">Worked Example 2</p>
        <h2>\\( f(x)=5x^4-3x^2+7 \\)</h2>
        <p class="muted">Differentiate each term separately. Constants disappear.</p>

        <div class="step-reveal shown" id="ex2step1">
          <div class="step-num">Term 1</div>
          <p>\\[ \\dfrac{d}{dx}(5x^4)=20x^3 \\]</p>
        </div>
        <div class="step-reveal" id="ex2step2">
          <div class="step-num">Term 2</div>
          <p>\\[ \\dfrac{d}{dx}(-3x^2)=-6x \\]</p>
        </div>
        <div class="step-reveal" id="ex2step3">
          <div class="step-num">Term 3</div>
          <p>\\[ \\dfrac{d}{dx}(7)=0 \\]</p>
        </div>
        <div class="step-reveal" id="ex2step4">
          <div class="step-num">Result</div>
          <div class="rule-box small">\\[ \\boxed{f'(x)=20x^3-6x} \\]</div>
        </div>

        <div class="btn-row">
          <button class="btn" id="ex2NextStepBtn">SHOW NEXT STEP →</button>
          <button class="btn amber" id="ex2ContinueBtn" style="display:none;">START CHALLENGE 🎮</button>
        </div>
      </div>
    `;
    typeset();

    let step = 1;
    const nextBtn = document.getElementById("ex2NextStepBtn");
    const contBtn = document.getElementById("ex2ContinueBtn");

    nextBtn.addEventListener("click", () => {
      step++;
      const el = document.getElementById(`ex2step${step}`);
      if(el){ el.classList.add("shown"); typeset(); }
      if(step === 4){
        nextBtn.style.display = "none";
        contBtn.style.display = "inline-block";
      }
    });

    contBtn.addEventListener("click", () => goToStage("challenge1"));
  }

  /* =========================================================
     9. CHALLENGE ENGINE (shared by Challenge 1 & 2)
  ========================================================= */
  function ensureChallenge(num){
    if(state.challenges[num]) return state.challenges[num];
    let main;
    if(num === 1){
      main = { polyMap: {7:1}, questionLatex: "f(x)=x^7", correctMap: {6:7} };
    } else {
      main = generatePolynomialQuestion();
    }
    const challenge = {
      main,
      phase: "main",       // "main" | "solved"
      attempts: 0,
      hintsShown: 0,
      practice: null,
      practiceAttempts: 0,
      resolved: false,
      earnedScore: 0
    };
    state.challenges[num] = challenge;
    saveState();
    return challenge;
  }

  function scoreForAttempt(attemptNumber){
    if(attemptNumber === 1) return 100;
    if(attemptNumber === 2) return 80;
    return 60;
  }

  function renderChallenge(num){
    trackEvent("derivative_question_started", { question_number: num });
    const ch = ensureChallenge(num);
    const panel = document.getElementById("stagePanel");

    if(ch.resolved){
      renderChallengeResolved(num, ch);
      return;
    }

    panel.innerHTML = `
      <div class="card">
        <div class="challenge-head">
          <span class="challenge-badge">CHALLENGE ${num}</span>
          <h2 style="margin:0;">⚡ Differentiate</h2>
        </div>
        <div class="rule-box">\\[ ${ch.main.questionLatex.replace('f(x)=','f(x)=')} \\]</div>

        <div class="answer-row">
          <label class="visually-hidden" for="answerInput${num}">Enter your derivative</label>
          <input type="text" id="answerInput${num}" placeholder="Enter your derivative" autocomplete="off" inputmode="text">
          <button class="btn amber" id="checkBtn${num}">CHECK ANSWER</button>
        </div>

        <div id="feedbackArea${num}"></div>
        <div id="hintArea${num}"></div>
        <div id="solutionArea${num}"></div>
      </div>
    `;
    typeset();

    const input = document.getElementById(`answerInput${num}`);
    const checkBtn = document.getElementById(`checkBtn${num}`);

    const submit = () => handleMainSubmit(num);
    checkBtn.addEventListener("click", submit);
    input.addEventListener("keydown", (e) => { if(e.key === "Enter") submit(); });
    input.focus();
  }

  function handleMainSubmit(num){
    const ch = state.challenges[num];
    const input = document.getElementById(`answerInput${num}`);
    const value = input.value;
    if(!value || !value.trim()) return;

    ch.attempts++;
    state.totalAttempts++;
    const result = checkDerivativeAnswer(value, ch.main.correctMap);

    const feedbackArea = document.getElementById(`feedbackArea${num}`);
    const hintArea = document.getElementById(`hintArea${num}`);
    const solutionArea = document.getElementById(`solutionArea${num}`);

    if(result.valid && result.correct){
      const pts = scoreForAttempt(ch.attempts);
      ch.earnedScore = pts;
      ch.resolved = true;
      if(ch.attempts === 1) state.correctFirstTry++;
      state.score += pts;
      trackEvent("derivative_question_correct", { question_number: num, attempt_number: ch.attempts, hints_used: ch.hintsShown, score: pts });
      saveState();
      feedbackArea.innerHTML = `
        <div class="feedback correct">
          🎉 CORRECT! Excellent! You applied the power rule correctly.
          <div class="pts">+${pts} points</div>
        </div>`;
      hintArea.innerHTML = "";
      const nextLabel = num === 1 ? "NEXT CHALLENGE →" : "SEE YOUR RESULTS →";
      feedbackArea.innerHTML += `<div class="btn-row"><button class="btn teal" id="advanceBtn${num}">${nextLabel}</button></div>`;
      document.getElementById(`advanceBtn${num}`).addEventListener("click", () => {
        if(num === 1) goToStage("challenge2");
        else goToStage("complete");
      });
      renderRail();
      return;
    }

    // incorrect or unparsable
    trackEvent("derivative_question_wrong", { question_number: num, attempt_number: ch.attempts, hints_used: ch.hintsShown });
    input.value = "";
    input.focus();

    if(!result.valid){
      feedbackArea.innerHTML = `<div class="feedback wrong">❌ I couldn't read that expression. Try a format like <code>7x^6</code> or <code>7*x^6</code>.</div>`;
    } else {
      feedbackArea.innerHTML = `<div class="feedback wrong">❌ Not quite. Try again!</div>`;
    }

    if(ch.attempts === 1){
      ch.hintsShown = 1;
      state.hintsUsed++;
      trackEvent("derivative_hint_used", { question_number: num, hint_number: 1 });
      hintArea.innerHTML = `<div class="hint-box">💡 <strong>Hint 1:</strong> Apply the power rule to each term separately. What is the exponent of \\(x\\)?</div>`;
      typeset();
    } else if(ch.attempts === 2){
      ch.hintsShown = 2;
      state.hintsUsed++;
      trackEvent("derivative_hint_used", { question_number: num, hint_number: 2 });
      hintArea.innerHTML = `<div class="hint-box">💡 <strong>Hint 2:</strong> For \\(ax^n\\), the derivative is \\(anx^{n-1}\\). Bring the exponent down as the coefficient and reduce the exponent by 1.</div>`;
      typeset();
    } else if(ch.attempts >= 3){
      hintArea.innerHTML = "";
      document.getElementById(`checkBtn${num}`).disabled = true;
      input.disabled = true;
      ch.practice = num === 1 ? generatePowerQuestion(7) : generatePolynomialQuestion();
      saveState();
      renderPractice(num, solutionArea);
      return;
    }
    saveState();
  }

  function renderPractice(num, solutionArea){
    const ch = state.challenges[num];
    solutionArea.innerHTML = `
      <div class="solution-box">
        <strong>Here's the worked solution:</strong>
        <div style="margin-top:8px;">\\[ \\dfrac{d}{dx}\\left(${ch.main.questionLatex.split('=')[1]}\\right) = ${polyMapToLatex(ch.main.correctMap)} \\]</div>
      </div>
      <div class="practice-block">
        <p class="eyebrow">💪 One more like it, to lock it in</p>
        <div class="rule-box small">\\[ ${ch.practice.questionLatex} \\]</div>
        <div class="answer-row">
          <label class="visually-hidden" for="practiceInput${num}">Enter your derivative</label>
          <input type="text" id="practiceInput${num}" placeholder="Enter your derivative" autocomplete="off">
          <button class="btn amber" id="practiceCheckBtn${num}">CHECK ANSWER</button>
        </div>
        <div id="practiceFeedback${num}"></div>
      </div>
    `;
    typeset();

    const pInput = document.getElementById(`practiceInput${num}`);
    const pBtn = document.getElementById(`practiceCheckBtn${num}`);
    const submit = () => handlePracticeSubmit(num);
    pBtn.addEventListener("click", submit);
    pInput.addEventListener("keydown", (e) => { if(e.key === "Enter") submit(); });
    pInput.focus();
  }

  function handlePracticeSubmit(num){
    const ch = state.challenges[num];
    const input = document.getElementById(`practiceInput${num}`);
    const value = input.value;
    if(!value || !value.trim()) return;

    ch.practiceAttempts++;
    state.totalAttempts++;
    const result = checkDerivativeAnswer(value, ch.practice.correctMap);
    const feedback = document.getElementById(`practiceFeedback${num}`);

    if(result.valid && result.correct){
      ch.earnedScore = 40;
      ch.resolved = true;
      state.score += 40;
      trackEvent("derivative_question_correct", { question_number: num, attempt_number: ch.attempts + ch.practiceAttempts, hints_used: ch.hintsShown, score: 40 });
      saveState();
      const isSecond = num === 2;
      feedback.innerHTML = `
        <div class="feedback correct">
          🎉 CORRECT! You've got it.
          <div class="pts">+40 points</div>
          <div class="btn-row"><button class="btn teal" id="practiceAdvance${num}">${isSecond ? "SEE YOUR RESULTS →" : "NEXT CHALLENGE →"}</button></div>
        </div>`;
      document.getElementById(`practiceAdvance${num}`).addEventListener("click", () => {
        if(num === 1) goToStage("challenge2"); else goToStage("complete");
      });
      renderRail();
    } else {
      input.value = "";
      input.focus();
      const msg = result.valid ? "❌ Not quite. Compare it term-by-term with the rule above and try again." : "❌ I couldn't read that expression. Try a format like <code>7x^6</code>.";
      feedback.innerHTML = `<div class="feedback wrong">${msg}</div>`;
      saveState();
    }
  }

  function renderChallengeResolved(num, ch){
    // In case user navigates back to an already-solved challenge (e.g. via refresh mid-flow)
    const panel = document.getElementById("stagePanel");
    panel.innerHTML = `
      <div class="card">
        <div class="challenge-head">
          <span class="challenge-badge">CHALLENGE ${num}</span>
          <h2 style="margin:0;">✓ Already completed</h2>
        </div>
        <p>You earned <strong>${ch.earnedScore} points</strong> on this challenge.</p>
        <div class="btn-row">
          <button class="btn teal" id="moveOnBtn">${num === 1 ? "NEXT CHALLENGE →" : "SEE YOUR RESULTS →"}</button>
        </div>
      </div>
    `;
    document.getElementById("moveOnBtn").addEventListener("click", () => {
      if(num === 1) goToStage("challenge2"); else goToStage("complete");
    });
  }

  /* =========================================================
     10. STAGE: COMPLETE
  ========================================================= */
  function renderComplete(){
    if(!state.completionTime){
      state.completionTime = Date.now();
      trackEvent("derivative_level1_completed", {
        total_score: state.score,
        hints_used: state.hintsUsed,
        attempts: state.totalAttempts,
        time_taken_seconds: Math.floor((state.completionTime - state.startTime) / 1000)
      });
      saveState();
      launchConfetti();
    }
    stopTimer();

    const totalTime = Math.floor((state.completionTime - state.startTime) / 1000);
    const panel = document.getElementById("stagePanel");
    panel.innerHTML = `
      <div class="card complete-hero">
        <div class="trophy">🏆</div>
        <h2>LEVEL 1 COMPLETE!</h2>
        <p class="muted">You have mastered the basic power rule and polynomial derivatives.</p>

        <table class="stats-table">
          <tr><td>Power Rule</td><td class="check">✓</td></tr>
          <tr><td>Constants</td><td class="check">✓</td></tr>
          <tr><td>Polynomial Derivatives</td><td class="check">✓</td></tr>
          <tr><td>Challenge Score</td><td>${state.score}/200</td></tr>
          <tr><td>Hints Used</td><td>${state.hintsUsed}</td></tr>
          <tr><td>Attempts</td><td>${state.totalAttempts}</td></tr>
          <tr><td>Time</td><td>${formatDuration(totalTime)}</td></tr>
        </table>

        <div class="unlock-card">
          <div class="lock-title">🔓 LEVEL 2 UNLOCKED</div>
          <p style="margin:4px 0 0; color:#C9D4E8;">Level 2 will introduce Exponential &amp; Logarithmic Derivatives.</p>
        </div>

        <div class="btn-row" style="justify-content:center; margin-top:20px;">
          <button class="btn amber" id="level2Btn">CONTINUE TO LEVEL 2 →</button>
        </div>
        <p id="level2Note" class="locked-note" style="display:none;">Level 2 isn't built yet in this prototype — check back soon!</p>
      </div>
    `;
    document.getElementById("level2Btn").addEventListener("click", () => {
      document.getElementById("level2Note").style.display = "block";
    });
    updateTimerDisplay();
  }

  function launchConfetti(){
    const colors = ["#E8A33D","#2A9D8F","#E4572E","#16213A"];
    for(let i = 0; i < 26; i++){
      const el = document.createElement("div");
      el.className = "confetti";
      el.style.left = Math.random() * 100 + "vw";
      el.style.background = colors[i % colors.length];
      el.style.animationDuration = (2 + Math.random() * 1.5) + "s";
      el.style.opacity = "0.9";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  }

  /* =========================================================
     11. TIME'S UP OVERLAY
  ========================================================= */
  function renderTimeUp(){
    stopTimer();
    const panel = document.getElementById("stagePanel");
    const elapsed = LEVEL_SECONDS;
    panel.innerHTML = `
      <div class="card timeup-overlay">
        <h2>⏰ TIME'S UP</h2>
        <p>You reached stage <strong>${STAGE_LABELS[STAGES.indexOf(state.stage)]}</strong> with a score of <strong>${state.score}</strong> points.</p>
        <p class="muted">No problem — take another run at Level 1 whenever you're ready.</p>
        <div class="btn-row" style="justify-content:center;">
          <button class="btn" id="timeUpRestartBtn">RESTART LEVEL 1</button>
        </div>
      </div>
    `;
    document.getElementById("timeUpRestartBtn").addEventListener("click", resetLevel);
  }

  /* =========================================================
     12. STAGE ROUTER
  ========================================================= */
  function goToStage(stage){
    state.stage = stage;
    saveState();
    render();
  }

  function render(){
    renderRail();

    if(state.timeUp && state.stage !== "complete"){
      renderTimeUp();
      return;
    }

    switch(state.stage){
      case "learn": renderLearn(); break;
      case "example1": renderExample1(); break;
      case "example2": renderExample2(); break;
      case "challenge1": renderChallenge(1); break;
      case "challenge2": renderChallenge(2); break;
      case "complete": renderComplete(); break;
      default: renderLearn();
    }
  }

  function resetLevel(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    stopTimer();
    state = defaultState();
    init();
  }

  document.getElementById("restartBtn").addEventListener("click", () => {
    if(confirm("Restart Level 1? Your current progress and score will be cleared.")){
      resetLevel();
    }
  });

  /* =========================================================
     13. INIT
  ========================================================= */
  function init(){
    if(!state.startTime){
      state.startTime = Date.now();
    }
    if(!state.startedEventFired){
      state.startedEventFired = true;
      trackEvent("derivative_level1_started", {});
    }
    saveState();
    startTimer();
    render();
  }

  document.addEventListener("DOMContentLoaded", () => {
    // If MathJax loads after DOMContentLoaded that's fine — typeset() is called after every render.
    init();
  });
})();
</script>

</body>
